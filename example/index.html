<!doctype html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapid Outline Atlas Demo</title>
    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #d8e0e6;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
        }

        .stage {
            position: relative;
        }

        .filter-toggle {
            position: absolute;
            top: 14px;
            right: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            background: rgba(255, 255, 255, 0.86);
            border: 1px solid rgba(42, 55, 68, 0.18);
            border-radius: 6px;
            color: #203040;
            font-size: 14px;
            font-weight: 700;
            user-select: none;
        }

        .filter-toggle input {
            width: 16px;
            height: 16px;
            margin: 0;
        }

        canvas {
            width: 960px;
            height: 720px;
            max-width: 100vw;
            max-height: 100vh;
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <div class="stage">
        <label class="filter-toggle">
            <input id="useFilters" type="checkbox" checked>
            applyFilters
        </label>
        <canvas id="canvas" width="960" height="720"></canvas>
    </div>
    <script type="module" src="./main.ts"></script>
</body>
</html>
